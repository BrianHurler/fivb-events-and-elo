profile_name: senior_fivb_plus_continental_2008_v1

selection:
  genders:
    - M
    - W

  # VIS coverage before 2008 is retained in the source archive but is not
  # trusted for Elo construction.
  start_date: 2008-01-01
  end_date: null

  # Qualification matches are part of the tournament competition history and
  # are included by default. This can be changed for a frozen downstream profile.
  include_qualification: true

  # Senior FIVB / World Tour / Beach Pro Tour competition universe.
  include_event_classes:
    - Olympic Games
    - World Championship
    - World Tour Finals
    - Pro Tour Finals
    - Elite16
    - Challenge
    - Futures
    - Grand Slam
    - Major Series
    - 5-Star
    - 4-Star
    - 3-Star
    - 2-Star
    - 1-Star
    - Open
    - Challenger
    - World Series

  # Senior continental competitions are included only for the selected
  # confederations below. Youth age-group classes and zonal tours remain out.
  include_continental_event_classes:
    - Continental Championship
    - Continental Tour
    - Continental Cup
    - Other Continental
    - CEV Masters

  include_continental_organizer_codes:
    - AVC
    - NORCECA
    - CSV
    - CEV

  # Africa is intentionally outside this Elo profile.
  exclude_continental_organizer_codes:
    - CAVB

  # VIS tournament No values. Manual include wins over class selection;
  # manual exclude is applied last.
  include_tournament_nos:
    - 1008
    - 1009
    - 2060
    - 2061
    - 2069
    - 3305
    - 3306
    - 5417
    - 5419
    - 6271
    - 7003
    - 7496
  exclude_tournament_nos:
    - 505

  # VIS BeachMatch No values. Explicit match includes join the selected universe;
  # explicit match excludes are applied last.
  include_match_nos: []
  exclude_match_nos: []

elo:
  initial_rating: 1500
  k_factor: 30
  scale: 400
  opponent_strength: mean
  update_unit: athlete
